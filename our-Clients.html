<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Our Collaborations</title>


  <!-- =====================================================
       GOOGLE FONTS
  ====================================================== -->

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Raleway:wght@300;400;500&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    /* =====================================================
       BASE
    ====================================================== */

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Raleway', sans-serif;

      margin: 0;
      padding: 0;

      background: #0d0d0d;

      color: #ffffff;

      overflow-x: hidden;
    }


    /* =====================================================
       MAIN CONTAINER
    ====================================================== */

    .container {

      width: 100%;

      max-width: 1400px;

      margin: 0 auto;

      padding:
        70px 30px 80px;
    }


    /* =====================================================
       PAGE TITLE
    ====================================================== */

    h1 {

      font-family:
        'Playfair Display',
        serif;

      font-size:
        clamp(
          2.8rem,
          5vw,
          4.5rem
        );

      font-weight: 700;

      letter-spacing: 2px;

      margin:
        0 0 70px;

      color: #ffcc00;

      text-align: center;

      position: relative;

      opacity: 0;

      animation:
        fadeDown
        1.2s
        ease
        forwards;
    }


    /* =====================================================
       TITLE UNDERLINE
    ====================================================== */

    h1::after {

      content: "";

      width: 80px;

      height: 3px;

      background: #ffcc00;

      display: block;

      margin:
        18px auto 0;

      border-radius: 2px;
    }


    /* =====================================================
       TITLE ANIMATION
    ====================================================== */

    @keyframes fadeDown {

      from {

        opacity: 0;

        transform:
          translateY(-40px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       COLLABORATION GRID
    ====================================================== */

    #content {

      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(
            0,
            1fr
          )
        );

      gap: 30px;

      width: 100%;
    }


    /* =====================================================
       COLLABORATION CARD
    ====================================================== */

    .content-card {

      background: #151515;

      border:
        1px solid #292929;

      border-radius: 18px;

      overflow: hidden;

      opacity: 0;

      transform:
        translateY(30px);

      animation:
        cardIn
        0.7s
        ease
        forwards;

      transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }


    /* =====================================================
       CARD HOVER
    ====================================================== */

    .content-card:hover {

      transform:
        translateY(-6px);

      border-color:
        #3a3a3a;

      box-shadow:
        0 15px 40px
        rgba(
          0,
          0,
          0,
          0.45
        );
    }


    /* =====================================================
       IMAGE CONTAINER

       IMPORTANT:
       Fixed height keeps all cards aligned.
    ====================================================== */

    .content-image {

      width: 100%;

      height: 250px;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }


    /* =====================================================
       CLIENT / LOGO IMAGE

       contain = NEVER CROP THE IMAGE
    ====================================================== */

    .content-image img {

      width: 100%;

      height: 100%;

      object-fit: contain;

      object-position: center;

      display: block;

      padding: 18px;

      transition:
        transform 0.4s ease;
    }


    /* =====================================================
       IMAGE HOVER
    ====================================================== */

    .content-card:hover
    .content-image img {

      transform:
        scale(1.04);
    }


    /* =====================================================
       CARD CONTENT
    ====================================================== */

    .content-body {

      padding:
        24px 25px 27px;
    }


    /* =====================================================
       CARD TITLE
    ====================================================== */

    .content-body h2 {

      font-family:
        'Playfair Display',
        serif;

      margin:
        0 0 10px;

      font-size:
        1.8rem;

      font-weight: 700;

      line-height: 1.2;

      color: #ffffff;
    }


    /* =====================================================
       CARD DESCRIPTION
    ====================================================== */

    .content-body p {

      color: #cccccc;

      line-height: 1.7;

      margin: 0;

      font-size: 15px;
    }


    /* =====================================================
       NO CONTENT / LOADING
    ====================================================== */

    .no-content,
    .loading {

      text-align: center;

      color: #999;

      font-size: 16px;

      padding:
        60px 20px;

      grid-column:
        1 / -1;
    }


    /* =====================================================
       CARD ANIMATION
    ====================================================== */

    @keyframes cardIn {

      from {

        opacity: 0;

        transform:
          translateY(30px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       TABLET
    ====================================================== */

    @media (max-width: 1000px) {

      .container {

        padding:
          55px 25px 65px;
      }


      h1 {

        font-size:
          3.3rem;

        margin-bottom:
          55px;
      }


      #content {

        grid-template-columns:
          repeat(
            2,
            minmax(
              0,
              1fr
            )
          );

        gap: 25px;
      }


      .content-image {

        height: 230px;
      }


      .content-body h2 {

        font-size:
          1.6rem;
      }

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 700px) {

      .container {

        padding:
          40px 15px 55px;
      }


      /* -----------------------------------------------
         TITLE
      ----------------------------------------------- */

      h1 {

        font-size:
          2.5rem;

        letter-spacing:
          1.5px;

        margin-bottom:
          45px;
      }


      h1::after {

        width:
          70px;

        height:
          3px;

        margin-top:
          15px;
      }


      /* -----------------------------------------------
         ONE COLUMN
      ----------------------------------------------- */

      #content {

        grid-template-columns:
          1fr;

        gap:
          22px;
      }


      /* -----------------------------------------------
         IMAGE
      ----------------------------------------------- */

      .content-image {

        height:
          230px;
      }


      .content-image img {

        padding:
          15px;
      }


      /* -----------------------------------------------
         CONTENT
      ----------------------------------------------- */

      .content-body {

        padding:
          21px 22px 24px;
      }


      .content-body h2 {

        font-size:
          1.7rem;

        margin-bottom:
          9px;
      }


      .content-body p {

        font-size:
          14px;

        line-height:
          1.65;
      }

    }


    /* =====================================================
       SMALL MOBILE
    ====================================================== */

    @media (max-width: 400px) {

      .container {

        padding:
          35px 12px 50px;
      }


      h1 {

        font-size:
          2.2rem;

        margin-bottom:
          40px;
      }


      .content-image {

        height:
          210px;
      }


      .content-image img {

        padding:
          13px;
      }


      .content-body h2 {

        font-size:
          1.55rem;
      }


      .content-body p {

        font-size:
          13.5px;
      }

    }


    /* =====================================================
       REDUCED MOTION
    ====================================================== */

    @media (
      prefers-reduced-motion: reduce
    ) {

      html {

        scroll-behavior:
          auto;
      }


      *,
      *::before,
      *::after {

        animation:
          none !important;

        transition:
          none !important;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN
  ====================================================== -->

  <main class="container">


    <!-- ===================================================
         TITLE
    ==================================================== -->

    <h1>
      OUR COLLABORATIONS
    </h1>


    <!-- ===================================================
         CONTENT
    ==================================================== -->

    <div id="content">

      <div class="loading">
        Loading...
      </div>

    </div>


  </main>


  <!-- =====================================================
       FIREBASE / CMS
  ====================================================== -->

  <script type="module">

    import {
      getCollection
    } from "./dynamic-content.js";


    /* =====================================================
       LOAD COLLABORATIONS
    ====================================================== */

    async function loadClients() {

      const container =
        document.getElementById(
          "content"
        );


      try {

        const items =
          await getCollection(
            "startups"
          );


        /* ================================================
           EMPTY
        ================================================= */

        if (
          !items ||
          !items.length
        ) {

          container.innerHTML = `

            <div class="no-content">

              No client entries
              available yet.

            </div>

          `;

          return;

        }


        /* ================================================
           CREATE CARDS
        ================================================= */

        container.innerHTML =

          items
            .map(
              (
                item,
                index
              ) => `

                <article
                  class="content-card"
                  style="
                    animation-delay:
                    ${index * 0.1}s
                  "
                >

                  ${
                    item.imageUrl

                    ?

                    `

                      <div
                        class="content-image"
                      >

                        <img
                          src="${escapeAttr(
                            item.imageUrl
                          )}"
                          alt="${escapeAttr(
                            item.title ||
                            "Client"
                          )}"
                          loading="lazy"
                        >

                      </div>

                    `

                    :

                    ""

                  }


                  <div
                    class="content-body"
                  >

                    <h2>

                      ${escapeHtml(
                        item.title ||
                        "Client"
                      )}

                    </h2>


                    ${
                      item.description

                      ?

                      `

                        <p>

                          ${escapeHtml(
                            item.description
                          )}

                        </p>

                      `

                      :

                      ""

                    }

                  </div>

                </article>

              `
            )
            .join("");


      }

      catch (error) {

        console.error(
          "Clients loading error:",
          error
        );


        container.innerHTML = `

          <div class="no-content">

            Unable to load
            client information.

          </div>

        `;

      }

    }


    /* =====================================================
       ESCAPE HTML
    ====================================================== */

    function escapeHtml(
      value = ""
    ) {

      return String(
        value
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       ESCAPE ATTRIBUTE
    ====================================================== */

    function escapeAttr(
      value = ""
    ) {

      return escapeHtml(
        value
      );

    }


    /* =====================================================
       START
    ====================================================== */

    loadClients();

  </script>


</body>

</html>
